schema_version: "1.1"
name: auto-report
description: "DESIGN §14 real-model (c): a worker that ends without calling report is auto-reported by the mod (nudge x2, then computed commit; flag auto-reported)."
tags: [cadre, close, auto-report]
plugins: ["../.."]
runs: 1
context:
  scaffold_script: scaffold.sh
execution:
  model: sonnet
  max_turns: 150
  timeout_seconds: 2400
  allowed_tools: [Read, Glob, Grep, Skill, Agent, TaskCreate, TaskUpdate, TaskList, TaskGet, "mcp__*"]
  env:
    EVAL_STACK: ts
