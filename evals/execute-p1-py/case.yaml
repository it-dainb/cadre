schema_version: "1.1"
name: execute-p1-py
description: "DESIGN §14 real-model (b): execute the approved plan p-p1 end to end on the py fixture (tester → red → worker → green → reviewer → merge)."
tags: [cadre, pipeline, py]
plugins: ["../.."]
runs: 1
context:
  scaffold_script: scaffold.sh
execution:
  model: sonnet
  max_turns: 150
  timeout_seconds: 2400
  allowed_tools: [Read, Glob, Grep, Skill, Agent, "mcp__*"]
  env:
    EVAL_STACK: py
